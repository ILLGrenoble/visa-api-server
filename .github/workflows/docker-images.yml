name: Build and push visa-api-server docker image

on:
  push:
    branches: [ dev ]
    tags: [ "*.*.*" ]
  pull_request:
    branches: [ dev ]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: VISA API Server Docker metadata
        id: meta-api
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/illgrenoble/visa-api-server
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: VISA VDI Docker metadata
        id: meta-vdi
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/illgrenoble/visa-vdi
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push VISA API Server
        uses: docker/build-push-action@v7
        with:
          context    : .
          file       : ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}

      - name: Build and push VISA VDI
        uses: docker/build-push-action@v7
        with:
          context    : .
          file       : ./docker/Dockerfile.vdi.dockerfile
          push: true
          tags: ${{ steps.meta-vdi.outputs.tags }}

      - name: Trigger external deploy pipeline
        if: success() && github.ref == 'refs/heads/dev'
        run: |
          if [ -z "${{ secrets.DEPLOY_PIPELINE_URL }}" ]; then
            echo "Error: DEPLOY_PIPELINE_URL is not set"
          else
            curl -X POST "${{ secrets.DEPLOY_PIPELINE_URL }}"
          fi
